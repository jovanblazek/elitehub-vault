name: Docker Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '.dockerignore'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/docker.yml'

jobs:
  docker-build:
    name: Build ${{ matrix.name }} image
    # Native arm64 to match the production server
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: eddn-listener
            dockerfile: apps/eddn-listener/Dockerfile
          - name: eddn-worker
            dockerfile: apps/eddn-worker/Dockerfile
          - name: db-migrator
            dockerfile: packages/db/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: elitehub-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify Node version
        run: |
          expected="v$(cat .nvmrc)"
          actual="$(docker run --rm elitehub-${{ matrix.name }}:ci node -v)"
          echo "Image Node version: ${actual}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Expected ${expected} (from .nvmrc), got ${actual}" >&2
            exit 1
          fi
